api: tokmon.lens/wavefront
id: org.tokmon.lens.adder-node
display_name: Node.js Adder Lens
version: 0.1.0
abi: { major: 2, minor: 0 }
runtime:
  kind: node
  version: 25.8.1
  entry: adder.mjs
  module: esm
trust: t2
stateless: true
observes:
  - { kind: user.input, schema: "*" }
inputs: []
outputs:
  - { port: model.tools, band: model.tools, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
refracts:
  - { kind: tool.add, schema: tokmon.math.add.v1 }
light_permissions: [photon.emit, log.write]
