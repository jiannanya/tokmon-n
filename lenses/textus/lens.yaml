api: tokmon.lens/wavefront
id: org.tokmon.lens.textus
display_name: Textus / ModelSurface 光谱滤波镜
version: 0.1.0
abi: { major: 2, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: true
observes:
  - { kind: user.input, schema: "*" }
  - { kind: assistant.message, schema: "*" }
  - { kind: model.tool-call, schema: "*" }
  - { kind: tool.result, schema: "*" }
  - { kind: system.fragment, schema: "*" }
  - { kind: instruction.observed, schema: "*" }
  - { kind: "skill.*", schema: "*" }
  - { kind: memory.accepted, schema: "*" }
  - { kind: context.retrieved, schema: "*" }
  - { kind: "rag.*", schema: "*" }
  - { kind: summary.created, schema: "*" }
  - { kind: model.budget, schema: "*" }
inputs: []
outputs:
  - { port: model.messages, band: model.messages, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: model.context, band: model.context, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: diagnostic.context-budget, band: diagnostic.context-budget, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
refracts:
  - { kind: text.compact, schema: tokmon.text.compact.v1 }
  - { kind: text.summarize, schema: tokmon.text.summarize.v1 }
light_permissions: [photon.emit, log.write]
