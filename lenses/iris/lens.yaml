id: org.tokmon.lens.iris
display_name: Iris / 跨界折射镜
version: 0.1.0
abi: { major: 1, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: true
observes:
  - { kind: external.catalog-observed, schema: "*" }
  - { kind: "external.connection-*", schema: "*" }
  - { kind: "external.schema-*", schema: "*" }
view_channels: [model.tools, diagnostic.external]
refracts:
  - { kind: external.connect, schema: tokmon.external.connect.v1 }
  - { kind: external.disconnect, schema: tokmon.external.disconnect.v1 }
  - { kind: external.call, schema: tokmon.external.call.v1 }
  - { kind: external.poll, schema: tokmon.external.poll.v1 }
light_permissions: [photon.emit, io.http, log.write]
