api: tokmon.lens/wavefront
id: org.tokmon.lens.enso
display_name: Enso / 上下文全息定影镜
version: 0.1.0
abi: { major: 2, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: true
observes:
  - { kind: instruction.observed, schema: "*" }
  - { kind: "skill.*", schema: "*" }
  - { kind: "memory.*", schema: "*" }
  - { kind: "rag.*", schema: "*" }
  - { kind: "workspace.*", schema: "*" }
inputs: []
outputs:
  - { port: model.context, band: model.context, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: ui.context-sources, band: ui.context-sources, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: memory.catalog, band: memory.catalog, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: rag.catalog, band: rag.catalog, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
refracts:
  - { kind: skill.discover, schema: tokmon.skill.discover.v1 }
  - { kind: skill.load, schema: tokmon.skill.load.v1 }
  - { kind: context.retrieve, schema: tokmon.context.retrieve.v1 }
  - { kind: memory.propose, schema: tokmon.memory.propose.v1 }
  - { kind: memory.accept, schema: tokmon.memory.accept.v1 }
  - { kind: memory.reject, schema: tokmon.memory.reject.v1 }
  - { kind: memory.invalidate, schema: tokmon.memory.invalidate.v1 }
  - { kind: rag.reindex, schema: tokmon.rag.reindex.v1 }
light_permissions: [photon.emit, io.workspace.read, index.write, log.write]
