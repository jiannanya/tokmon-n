id: org.tokmon.lens.lemon
display_name: Lemon / 有界光纤波导
version: 0.1.0
abi: { major: 1, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: true
observes:
  - { kind: "waveguide.frame-*", schema: "*" }
  - { kind: "waveguide.cursor-*", schema: "*" }
  - { kind: worker.progress, schema: "*" }
  - { kind: model.chunk, schema: "*" }
view_channels: [diagnostic.transport, ui.stream]
refracts:
  - { kind: waveguide.send-frame, schema: tokmon.waveguide.frame.v1 }
  - { kind: waveguide.advance-cursor, schema: tokmon.waveguide.cursor.v1 }
  - { kind: waveguide.reconnect, schema: tokmon.waveguide.reconnect.v1 }
light_permissions: [photon.emit, log.write]
