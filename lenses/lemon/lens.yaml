api: tokmon.lens/wavefront
id: org.tokmon.lens.lemon
display_name: Lemon / 有界光纤波导
version: 0.1.0
abi: { major: 2, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: true
observes:
  - { kind: "waveguide.frame-*", schema: "*" }
  - { kind: "waveguide.cursor-*", schema: "*" }
  - { kind: "waveguide.subscription-*", schema: "*" }
  - { kind: worker.progress, schema: "*" }
  - { kind: "model.*chunk", schema: "*" }
inputs: []
outputs:
  - { port: diagnostic.transport, band: diagnostic.transport, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: ui.stream, band: ui.stream, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
refracts:
  - { kind: waveguide.send-frame, schema: tokmon.waveguide.frame.v1 }
  - { kind: waveguide.broadcast, schema: tokmon.waveguide.frame.v1 }
  - { kind: waveguide.advance-cursor, schema: tokmon.waveguide.cursor.v1 }
  - { kind: waveguide.subscribe, schema: tokmon.waveguide.subscription.v1 }
  - { kind: waveguide.unsubscribe, schema: tokmon.waveguide.subscription.v1 }
  - { kind: waveguide.reconnect, schema: tokmon.waveguide.reconnect.v1 }
light_permissions: [photon.emit, log.write]
