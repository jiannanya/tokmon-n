api: tokmon.lens/wavefront
id: org.tokmon.lens.styx
display_name: Styx / 执行隔离暗室
version: 0.1.0
abi: { major: 2, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: false
observes:
  - { kind: act.admitted, schema: "*" }
  - { kind: "sandbox.*", schema: "*" }
  - { kind: "process.*", schema: "*" }
  - { kind: "pty.*", schema: "*" }
  - { kind: "worker.*", schema: "*" }
  - { kind: "wasm.*", schema: "*" }
  - { kind: "remote.*", schema: "*" }
inputs: []
outputs:
  - { port: act.sandbox, band: act.sandbox, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: ui.terminal, band: ui.terminal, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
refracts:
  - { kind: process.exec, schema: tokmon.process.exec.v1 }
  - { kind: process.cancel, schema: tokmon.process.cancel.v1 }
  - { kind: pty.open, schema: tokmon.pty.open.v1 }
  - { kind: pty.write, schema: tokmon.pty.write.v1 }
  - { kind: pty.resize, schema: tokmon.pty.resize.v1 }
  - { kind: pty.close, schema: tokmon.pty.close.v1 }
  - { kind: worker.launch, schema: tokmon.worker.launch.v1 }
  - { kind: wasm.invoke, schema: tokmon.wasm.invoke.v1 }
  - { kind: remote.execute, schema: tokmon.remote.execute.v1 }
light_permissions: [photon.emit, io.process, secret.consume, log.write]
