api: tokmon.lens/wavefront
id: org.tokmon.lens.nota
display_name: Nota / 可观测性光谱分析仪
version: 0.1.0
abi: { major: 2, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: false
observes:
  - { kind: "act.*", schema: "*" }
  - { kind: "lens.*", schema: "*" }
  - { kind: "worker.*", schema: "*" }
  - { kind: "model.*", schema: "*" }
  - { kind: "workflow.*", schema: "*" }
  - { kind: "waveguide.*", schema: "*" }
  - { kind: "system.*", schema: "*" }
inputs: []
outputs:
  - { port: diagnostic.metrics, band: diagnostic.metrics, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: diagnostic.health, band: diagnostic.health, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: ui.diagnostics, band: ui.diagnostics, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
refracts:
  - { kind: telemetry.export, schema: tokmon.telemetry.export.v1 }
  - { kind: telemetry.configure, schema: tokmon.telemetry.configure.v1 }
  - { kind: telemetry.serve, schema: tokmon.telemetry.serve.v1 }
  - { kind: profile.capture, schema: tokmon.profile.capture.v1 }
  - { kind: diagnostic.bundle, schema: tokmon.diagnostic.bundle.v1 }
light_permissions: [photon.emit, telemetry.network, artifact.write, log.write]
