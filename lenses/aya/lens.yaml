id: org.tokmon.lens.aya
display_name: Aya / 子运行分形复眼镜
version: 0.1.0
abi: { major: 1, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: true
observes:
  - { kind: "child.*", schema: "*" }
  - { kind: "workspace.merge-*", schema: "*" }
view_channels: [child.runs, ui.child-runs, child.topology]
refracts:
  - { kind: child.spawn, schema: tokmon.child.spawn.v1 }
  - { kind: child.message, schema: tokmon.child.message.v1 }
  - { kind: child.join, schema: tokmon.child.join.v1 }
  - { kind: child.cancel, schema: tokmon.child.cancel.v1 }
  - { kind: workspace.merge-proposal, schema: tokmon.workspace.merge-proposal.v1 }
light_permissions: [photon.emit, io.process.git, workspace.worktree, log.write]
