api: tokmon.lens/wavefront
id: org.tokmon.lens.aya
display_name: Aya / 子运行分形复眼镜
version: 0.1.0
abi: { major: 2, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: true
observes:
  - { kind: "child.*", schema: "*" }
  - { kind: "workspace.merge-*", schema: "*" }
inputs: []
outputs:
  - { port: child.runs, band: child.runs, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: ui.child-runs, band: ui.child-runs, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: child.topology, band: child.topology, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
refracts:
  - { kind: child.spawn, schema: tokmon.child.spawn.v1 }
  - { kind: child.message, schema: tokmon.child.message.v1 }
  - { kind: child.join, schema: tokmon.child.join.v1 }
  - { kind: child.cancel, schema: tokmon.child.cancel.v1 }
  - { kind: workspace.merge-proposal, schema: tokmon.workspace.merge-proposal.v1 }
light_permissions: [photon.emit, io.process.git, workspace.worktree, log.write]
