api: tokmon.lens/wavefront
id: org.tokmon.lens.fallen
display_name: Fallen / Policy 偏振滤光镜
version: 0.1.0
abi: { major: 2, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: true
observes:
  - { kind: act.proposed, schema: "*" }
  - { kind: "approval.*", schema: "*" }
  - { kind: "trust.*", schema: "*" }
  - { kind: "policy.*", schema: "*" }
inputs: []
outputs:
  - { port: act.policy, band: act.policy, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: ui.approvals, band: ui.approvals, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
refracts:
  - { kind: approval.decide, schema: tokmon.approval.decide.v1 }
  - { kind: policy.evaluate, schema: tokmon.policy.evaluate.v1 }
  - { kind: content.classify, schema: tokmon.content.classify.v1 }
light_permissions: [photon.emit, log.write]
