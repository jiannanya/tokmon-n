id: org.tokmon.lens.tracket
display_name: Tracket / 因果记录与回放光路镜
version: 0.1.0
abi: { major: 1, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: true
observes:
  - { kind: "*", schema: "*" }
view_channels: [fact.integrity, ui.trajectory, ui.causality]
refracts:
  - { kind: integrity.verify, schema: tokmon.integrity.verify.v1 }
  - { kind: trace.vault-write, schema: tokmon.trace.vault-write.v1 }
  - { kind: replay.create, schema: tokmon.replay.create.v1 }
  - { kind: ray.fork, schema: tokmon.ray.fork.v1 }
  - { kind: trajectory.export, schema: tokmon.trajectory.export.v1 }
light_permissions: [photon.emit, trace.write, artifact.write, log.write]
