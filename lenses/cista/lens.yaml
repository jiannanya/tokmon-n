api: tokmon.lens/wavefront
id: org.tokmon.lens.cista
display_name: Cista / Secret 遮光秘盒
version: 0.1.0
abi: { major: 2, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: true
observes:
  - { kind: secret.ref-observed, schema: "*" }
  - { kind: "secret.*", schema: "*" }
  - { kind: "redaction.*", schema: "*" }
inputs: []
outputs:
  - { port: act.secrets, band: act.secrets, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: diagnostic.redaction, band: diagnostic.redaction, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
refracts:
  - { kind: secret.create, schema: tokmon.secret.create.v1 }
  - { kind: secret.read, schema: tokmon.secret.read.v1 }
  - { kind: secret.rotate, schema: tokmon.secret.rotate.v1 }
  - { kind: secret.delete, schema: tokmon.secret.delete.v1 }
  - { kind: secret.list-metadata, schema: tokmon.secret.list-metadata.v1 }
  - { kind: secret.bind, schema: tokmon.secret.bind.v1 }
  - { kind: redaction.apply, schema: tokmon.redaction.apply.v1 }
light_permissions: [photon.emit, secret.bind, os.keyring, log.write]
