api: tokmon.lens/wavefront
id: org.tokmon.lens.clotho
display_name: Clotho / 显式工作流光栅
version: 0.1.0
abi: { major: 2, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: true
observes:
  - { kind: "workflow.*", schema: "*" }
  - { kind: act.started, schema: "*" }
  - { kind: act.completed, schema: "*" }
  - { kind: act.failed, schema: "*" }
inputs: []
outputs:
  - { port: workflow.graph, band: workflow.graph, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: workflow.status, band: workflow.status, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
refracts:
  - { kind: workflow.define, schema: tokmon.workflow.define.v1 }
  - { kind: workflow.step, schema: tokmon.workflow.step.v1 }
  - { kind: workflow.record-step, schema: tokmon.workflow.record-step.v1 }
  - { kind: workflow.compensate, schema: tokmon.workflow.compensate.v1 }
  - { kind: workflow.record-compensation, schema: tokmon.workflow.record-compensation.v1 }
  - { kind: workflow.retry, schema: tokmon.workflow.retry.v1 }
  - { kind: workflow.pause, schema: tokmon.workflow.pause.v1 }
  - { kind: workflow.resume, schema: tokmon.workflow.resume.v1 }
  - { kind: workflow.cancel, schema: tokmon.workflow.cancel.v1 }
light_permissions: [photon.emit, log.write]
