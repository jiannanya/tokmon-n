api: tokmon.lens/wavefront
id: org.tokmon.lens.chora
display_name: Chora / 不可改写光感底片
version: 0.1.0
abi: { major: 2, minor: 0 }
runtime: { kind: in_process }
trust: t1
stateless: true
observes:
  - { kind: "*", schema: "*" }
inputs: []
outputs:
  - { port: fact.storage, band: fact.storage, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: diagnostic.capacity, band: diagnostic.capacity, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
  - { port: storage.kv, band: storage.kv, schema: tokmon.surface.contribution.v1, merge: stable_concat, surface: true }
refracts:
  - { kind: photon.export, schema: tokmon.photon.export.v1 }
  - { kind: kv.put, schema: tokmon.kv.put.v1 }
  - { kind: kv.delete, schema: tokmon.kv.delete.v1 }
  - { kind: blob.put, schema: tokmon.blob.put.v1 }
  - { kind: blob.verify, schema: tokmon.blob.verify.v1 }
  - { kind: checkpoint.build, schema: tokmon.checkpoint.build.v1 }
  - { kind: archive.seal, schema: tokmon.archive.seal.v1 }
  - { kind: backup.create, schema: tokmon.backup.create.v1 }
  - { kind: backup.restore, schema: tokmon.backup.restore.v1 }
light_permissions: [photon.emit, blob.write, artifact.write, backup.io, log.write]
